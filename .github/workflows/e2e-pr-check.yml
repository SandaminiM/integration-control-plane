name: E2E PR Check (WIP)

# Runs the smoke suite against the staging environment on every PR that touches
# the ipaas frontend. This is intentionally NOT a required status check — if you
# need to merge immediately you can ignore it without unblocking the PR.
#
# To make it required: add "E2E PR Check (WIP) / Playwright smoke suite" to your
# branch protection rules under Settings → Branches → Required status checks.

on:
  pull_request:
    branches:
      - main
      - devant-migration
    paths:
      - 'ipaas/**'

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ipaas/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ipaas
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ipaas
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: ipaas
        env:
          E2E_BASE_URL: https://preview-o2-dev.devant.dev
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: pnpm test:e2e --reporter=html,github

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ipaas/playwright-report/
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ipaas/test-results/
          retention-days: 3
