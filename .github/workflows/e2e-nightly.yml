name: E2E Nightly (WIP)

on:
  schedule:
    # 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests against (defaults to devant-migration)'
        required: false
        default: 'devant-migration'
      base_url:
        description: 'App URL to test against'
        required: false
        default: 'https://preview-o2-dev.devant.dev'

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'devant-migration' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ipaas/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ipaas
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ipaas
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: ipaas
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://preview-o2-dev.devant.dev' }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: pnpm test:e2e --reporter=html,github

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: ipaas/playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: ipaas/test-results/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          BRANCH: ${{ inputs.branch || 'devant-migration' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n --arg branch "$BRANCH" --arg url "$RUN_URL" \
            '{"text": "🔴 WIP E2E nightly failed on `\($branch)`. <\($url)|View run>"}')
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
